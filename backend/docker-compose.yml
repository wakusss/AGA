version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myapp-backend
    ports:
      - "8080:8080"                  # ← твой порт приложения
    environment:
      - SPRING_PROFILES_ACTIVE=dev   # или prod, если есть разные настройки
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/mydb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=supersecret123
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update  # validate / none в проде
    depends_on:
      db:
        condition: service_healthy   # ждёт, пока БД реально готова
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: myapp-postgres
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supersecret123
    ports:
      - "5433:5432"                  # ← 5433 на хосте, чтобы не конфликтовать с локальным postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data: